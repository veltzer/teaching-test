# Generated so `uv sync` installs this repo's Python dependencies.
# Derived from the third-party imports found in the repo's .py files.

[project]
name = "teaching-test"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching/archive repo: not an installable package.
package = false


[tool.pytest.ini_options]
# Tests import from here: add.py lives at the repo root and is not an installed package.
pythonpath = ["."]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    ".",
]
