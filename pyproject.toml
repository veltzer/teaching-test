# Generated so `uv sync` installs this repo's Python dependencies.
# Derived from the third-party imports found in the repo's .py files.

[project]
name = "teaching-test"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching/archive repo: not an installable package.
package = false


[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
# Tests import from here: add.py lives at the repo root and is not an installed package.
pythonpath = ["."]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
instance-var-assign = "error"
method-assign = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"
